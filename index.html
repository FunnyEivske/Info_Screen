<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buss & Vær Dashboard</title>
    
    <!-- 1. Import Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- 2. Import Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 3. Link to our external stylesheet (No Tailwind) -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Main Content Grid -->
    <div class="main-grid-container">
        
        <!-- Column 1: Universitetet -->
        <div class="card bus-column">
            <!-- Header -->
            <div class="card-header">
                <h2 class="card-title">Universitetet</h2>
                <div id="clock-1" class="clock-box">--:--</div>
            </div>
            <!-- Schedule List (Iframe) -->
            <div class="iframe-container">
                <iframe 
                    src="https://skilt.akt.no/Tmix.Cap.DigSig.Gui/App/Rtpi.aspx?numberOfRows=20&stopPointIds=9040029,9040030" 
                    class="bus-iframe"
                    title="Universitetet Departures"
                ></iframe>
            </div>
        </div>

        <!-- Column 2: Weather & Logs -->
        <div class="weather-column">
            <!-- Weather -->
            <div class="weather-block">
                <div>
                    <div class="weather-city">Grimstad</div>
                    <div id="temp-grimstad" class="weather-temp">…</div>
                </div>
                <div>
                    <div class="weather-city">Kristiansand</div>
                    <div id="temp-kristiansand" class="weather-temp">…</div>
                </div>
                <div>
                    <div class="weather-city">Arendal</div>
                    <div id="temp-arendal" class="weather-temp">…</div>
                </div>
            </div>
            <!-- Logs -->
            <div id="log-box">
                <p>Initialiserer...</p>
            </div>
        </div>

        <!-- Column 3: Avganger -->
        <div class="card bus-column">
            <!-- Header -->
            <div class="card-header">
                <h2 class="card-title">Avganger</h2>
                <div id="clock-2" class="clock-box">--:--</div>
            </div>
            <!-- Schedule List (Iframe) -->
            <div class="iframe-container">
                <iframe 
                    src="https://skilt.akt.no/Tmix.Cap.DigSig.Gui/App/Rtpi.aspx?numberOfRows=20&stopPointIds=9040031,9040032" 
                    class="bus-iframe"
                    title="Avganger Departures"
                ></iframe>
            </div>
        </div>

    </div>

    <!-- Bottom Ticker Bar -->
    <div class="ticker-wrapper">
        <div class="ticker-bar">
            <div class="tag nrk-tag">NRK</div>
            <p id="nrk-headline">Laster nyheter...</p>
            <div class="tag yr-tag">YR</div>
        </div>
        <div class="footer">
            Designed by Eivind_n.s with <span>♥</span>
        </div>
    </div>

    <!-- Link to the external JavaScript file. 
         'defer' ensures it runs after the HTML is parsed. -->
    <script src="script.js" defer></script>

</body>
</html>
