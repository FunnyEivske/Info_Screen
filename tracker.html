<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juleferie Oversikt - Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        m3: {
                            bg: '#141218',
                            surface: '#211F26', 
                            surfaceHigh: '#2B2930', 
                            primary: '#D0BCFF',
                            onPrimary: '#381E72',
                            primaryContainer: '#4F378B',
                            onPrimaryContainer: '#EADDFF',
                            secondary: '#CCC2DC',
                            onSecondary: '#332D41',
                            error: '#FFB4AB',
                            onError: '#690005'
                        }
                    },
                    fontFamily: { sans: ['Roboto', 'sans-serif'], },
                    borderRadius: { 'm3': '28px', 'm3-md': '16px' }
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #141218; /* M3 bg */
            margin: 0;
            overflow: hidden;
            height: 100vh;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="flex flex-col h-full bg-m3-bg text-m3-secondary">

    <canvas id="snow-canvas" class="fixed inset-0 pointer-events-none z-10 hidden"></canvas>

    <!-- Main Content: Tracker -->
    <div
        class="flex-grow flex flex-col items-center justify-center p-6 pb-32 relative z-10 w-full max-w-[95%] mx-auto overflow-y-auto h-full scrollbar-hide">
        <header class="text-center mb-8 shrink-0">
            <h1 id="tracker-title" class="text-5xl md:text-6xl text-m3-primary font-bold tracking-tight drop-shadow">
                Ferieoversikt
            </h1>
            <p class="text-m3-secondary mt-2 text-lg font-medium">God ferie til alle som har!</p>
        </header>

        <div id="employee-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-6 w-full fade-in shrink-0">
            <div class="col-span-full text-center text-m3-secondary animate-pulse">Laster ferieoversikt...</div>
        </div>

        <div id="pagination-dots" class="flex justify-center mt-6 h-4 shrink-0"></div>
    </div>

    <!-- Small Floating QR Code -->
    <div
        class="fixed bottom-6 left-6 z-[100] bg-m3-surfaceHigh/80 backdrop-blur-md p-3 rounded-m3-md shadow-[0_8px_20px_rgba(0,0,0,0.5)] border border-m3-primaryContainer hover:bg-m3-surfaceHigh transition-colors group">
        <div class="flex flex-col items-center gap-2">
            <div id="qrcode" class="bg-white p-1 rounded-lg shadow-inner"></div>
            <span
                class="text-m3-secondary text-[10px] font-bold uppercase tracking-wider opacity-0 group-hover:opacity-100 transition-opacity absolute -top-8 bg-m3-surface px-2 py-1 rounded shadow-lg border border-[#4A4458]">
                Registrer deg
            </span>
        </div>
    </div>

    <!-- Image Overlay -->
    <div id="overlay-container" class="hidden fixed inset-0 z-[10000] bg-m3-bg flex items-center justify-center">
        <img id="overlay-image" src="" class="w-full h-full object-cover">
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="hidden fixed inset-0 bg-m3-bg z-50 flex flex-col font-sans text-m3-secondary">
        <div id="comic-grid"
            class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4 p-4 overflow-y-auto w-full max-w-[1800px] mx-auto scroll-smooth no-scrollbar">
            <div class="col-span-full flex flex-col items-center justify-center h-full text-m3-secondary animate-pulse">
                <span class="text-lg font-bold">Laster inn striper...</span>
            </div>
        </div>
        <div class="min-h-[100px] bg-m3-surfaceHigh border-t border-[#4A4458] flex items-center justify-between px-8 py-4 shrink-0 shadow-[0_-5px_20px_rgba(0,0,0,0.3)] z-20 relative">
            <div class="flex-grow flex justify-start w-3/5 pr-4">
                <p id="dash-quote" class="text-lg md:text-xl text-m3-secondary italic text-left leading-normal whitespace-nowrap truncate border-l-4 border-m3-primary pl-6 py-2">
                    "Laster inspirasjon..."
                </p>
            </div>
            <div class="flex items-center justify-end gap-5 w-1/5 min-w-[150px]">
                <div id="dash-clock" class="text-5xl font-mono font-bold text-white tracking-tight">00:00</div>
                <div id="connection-status" class="w-4 h-4 rounded-full bg-m3-error shadow-[0_0_12px_rgba(255,180,171,0.7)] transition-colors duration-500">
                </div>
            </div>
        </div>
    </div>

    <!-- Screensaver Bouncer -->
    <div id="screensaver" class="hidden fixed inset-0 z-[5000] bg-m3-bg cursor-none">
        <div id="screensaver-bouncer" class="absolute text-6xl select-none" style="top:50%;left:50%">🎅</div>
    </div>

    <!-- Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Config
        const firebaseConfig = {
            apiKey: "AIzaSyCOcFfiRIw3sgU9eqEbwc1uc_Ur1aTOJXk",
            authDomain: "ferie-805e0.firebaseapp.com",
            projectId: "ferie-805e0",
            storageBucket: "ferie-805e0.firebasestorage.app",
            messagingSenderId: "621338557882",
            appId: "1:621338557882:web:9eae6887a484db316d7183",
            measurementId: "G-C8PT9DKJ3Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'holiday-tracker-main';

        const sessionId = localStorage.getItem('holiday_session_id') || 'sess_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('holiday_session_id', sessionId);

        function updateStatus(msg, color) {
            const el = document.getElementById('fb-status');
            if (el) {
                const time = new Date().toLocaleTimeString('nb-NO').split(' ')[0];
                el.innerHTML = `<span style="opacity:0.6">${time}</span> ${msg}`;
                el.style.color = color || 'white';
            }
        }

        // Init
        window.addEventListener('load', async () => {
            // UI Debug
            const disp = document.createElement('div');
            disp.className = "fixed bottom-1 right-1 text-[10px] text-white/80 font-mono pointer-events-none z-[200] mix-blend-difference flex flex-col items-end bg-black/50 p-1 rounded hidden";
            disp.innerHTML = `<div id="fb-status" class="font-bold">Init...</div><div class="text-white/50">${sessionId}</div>`;
            document.body.appendChild(disp);

            // Helpers
            window.Screensaver.init();
            Dashboard.init();

            // Generate Tiny QR Code
            const baseUrl = window.location.href.endsWith('/') ? window.location.href : window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
            new QRCode(document.getElementById("qrcode"), { 
                text: baseUrl + 'register.html', 
                width: 72, 
                height: 72, 
                colorDark: "#211F26", 
                colorLight: "#ffffff" 
            });

            // Auth
            try {
                updateStatus("Auth...", "yellow");
                await signInAnonymously(auth);
            } catch (e) {
                console.error("Auth Fail", e);
                updateStatus("Auth Err: " + e.code, "red");
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                updateStatus("Connected", "#4ade80");
                startHeartbeat();
                // Always start data listener to control rotation logic
                startDataListener();
            } else {
                updateStatus("No Auth", "orange");
            }
        });

        // Heartbeat
        function startHeartbeat() {
            const sessionRef = doc(db, 'artifacts', appId, 'sessions', sessionId);

            onSnapshot(sessionRef, (snap) => {
                if (!snap.exists()) return;
                const data = snap.data();
                if (data.command) {
                    handleCommand(data.command);
                    updateDoc(sessionRef, { command: null });
                }
                if (data.imageOverlay) handleImageOverlay(data.imageOverlay, sessionRef);
                else hideImageOverlay();
            });

            const beat = async () => {
                try {
                    await setDoc(sessionRef, {
                        lastSeen: new Date().toISOString(),
                        userAgent: navigator.userAgent,
                        resolution: `${window.innerWidth}x${window.innerHeight}`,
                        currentView: document.getElementById('dashboard-view').classList.contains('hidden') ? 'tracker' : 'dashboard',
                        screensaver: window.Screensaver.active ? window.Screensaver.mode : 'off'
                    }, { merge: true });
                } catch (e) {
                    updateStatus("HB Fail", "red");
                }
            };
            beat();
            setInterval(beat, 30000);
        }

        // Data Listener & Rotation Logic
        let toggleInterval;

        function startDataListener() {
            const currentSeason = getSeason() || 'winter';
            applySeasonTheme(currentSeason);

            // Query items
            const q = query(collection(db, 'artifacts', appId, 'public', 'data', currentSeason));

            onSnapshot(q, (snap) => {
                const items = [];
                snap.forEach(d => items.push({ id: d.id, ...d.data() }));

                // Auto-cleanup Expired (30 days past endDate)
                const cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - 30);
                const cutoffStr = cutoff.toISOString().split('T')[0];

                const todayStrForDisplay = new Date().toISOString().split('T')[0];
                const activeItems = [];

                items.forEach(async (item) => {
                    if (item.endDate && item.endDate < cutoffStr) {
                        try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', currentSeason, item.id)); } 
                        catch (e) { console.error("Cleanup fail", e); }
                    } else if (!item.endDate || item.endDate >= todayStrForDisplay) {
                        activeItems.push(item);
                    }
                });

                // Sort items by startDate
                activeItems.sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
                renderGrid(activeItems);

                // Check active holidays
                const hasActiveHolidays = activeItems.length > 0;
                
                // Rotation logic
                clearInterval(toggleInterval);

                if (hasActiveHolidays) {
                    // Activate 5 minute rotation
                    let showingTracker = false; // Start with Dashboard
                    
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    document.getElementById('dashboard-view').classList.add('flex');

                    toggleInterval = setInterval(() => {
                        showingTracker = !showingTracker;
                        if (showingTracker) {
                            // Show Tracker (Hide Dashboard)
                            document.getElementById('dashboard-view').classList.add('hidden');
                            document.getElementById('dashboard-view').classList.remove('flex');
                        } else {
                            // Show Dashboard (Hide Tracker)
                            document.getElementById('dashboard-view').classList.remove('hidden');
                            document.getElementById('dashboard-view').classList.add('flex');
                        }
                    }, 5 * 60 * 1000); // 5 minutes (300,000 ms)
                } else {
                    // Always show Dashboard
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    document.getElementById('dashboard-view').classList.add('flex');
                }
            });
        }

        function getSeason() {
            const date = new Date();
            const month = date.getMonth(); 
            const day = date.getDate();

            if (month === 11 || (month === 0 && day <= 5)) return 'christmas';
            if (month === 1 && day >= 15 && day <= 28) return 'winter';
            if (month === 2 || (month === 3 && day <= 22)) return 'spring';
            if ((month === 5 && day >= 20) || month === 6 || (month === 7 && day <= 18)) return 'summer';
            if ((month === 8 && day >= 28) || (month === 9 && day <= 10)) return 'autumn';

            return 'spring'; 
        }

        function createCard(emp) {
            const div = document.createElement('div');
            // M3 Color logic based on user selection or fallback
            let primaryColor = '#D0BCFF'; 
            let onPrimaryColor = '#381E72';
            const colorsMap = {
                red: { p: '#FFB4AB', on: '#690005' },
                pink: { p: '#FFB1C8', on: '#650033' },
                blue: { p: '#A8C7FA', on: '#062E6F' },
                green: { p: '#93D78C', on: '#00390B' },
                purple: { p: '#D0BCFF', on: '#381E72' },
                orange: { p: '#FFB599', on: '#5A1A00' },
                yellow: { p: '#E4C936', on: '#3A3000' },
                teal: { p: '#55D6F3', on: '#003642' }
            };

            if (emp.color && colorsMap[emp.color]) {
                primaryColor = colorsMap[emp.color].p;
                onPrimaryColor = colorsMap[emp.color].on;
            }

            div.className = "bg-m3-surfaceHigh p-6 rounded-m3 border border-[#4A4458] shadow-md flex flex-col justify-between min-h-[220px] relative overflow-hidden";
            div.innerHTML = `
                <div class="absolute -top-4 -right-4 w-16 h-16 rounded-full flex items-center justify-center text-3xl shadow-lg border-4 border-m3-bg transition-transform" style="background-color: ${primaryColor}; color: ${onPrimaryColor}">
                    ${emp.emoji || '🏝️'}
                </div>
                <div>
                   <h2 class="text-2xl font-bold mb-1 text-white">${emp.name}</h2>
                   <p class="text-[10px] font-bold uppercase tracking-wider text-m3-secondary">Ferie / Fravær</p>
                   <div class="mt-6 space-y-3">
                       <div class="bg-m3-surface p-3 rounded-m3-md border border-[#4A4458]/50">
                           <p class="text-[10px] uppercase font-bold text-m3-secondary mb-1 tracking-wider">Fra og med</p>
                           <p class="font-bold text-lg text-white">${emp.startDate}</p>
                       </div>
                       <div class="bg-m3-surface p-3 rounded-m3-md border border-[#4A4458]/50">
                           <p class="text-[10px] uppercase font-bold text-m3-secondary mb-1 tracking-wider">Til og med</p>
                           <p class="font-bold text-lg text-white">${emp.endDate}</p>
                       </div>
                   </div>
                </div>
                <!-- Delete removed from live view for safety, only in Admin -->
            `;
            return div;
        }

        function renderGrid(employees) {
            const grid = document.getElementById('employee-grid');
            grid.innerHTML = '';
            if (employees.length === 0) grid.innerHTML = '<div class="col-span-full text-center text-m3-secondary font-bold">Ingen aktive ferier lagret akkurat nå.</div>';
            employees.forEach(e => grid.appendChild(createCard(e)));
        }

        function applySeasonTheme(season) {
            const themes = {
                christmas: "FERIE 🎄",
                winter: "FERIE ⛷️",
                spring: "FERIE 🐣",
                summer: "FERIE ☀️",
                autumn: "FERIE 🍂"
            };
            const title = themes[season] || "FERIE ⛱️";
            document.getElementById('tracker-title').innerText = title;
        }

        function handleCommand(cmd) {
            if (cmd === 'reload') window.location.reload();
            if (cmd.startsWith('set_view')) {
                // Admin override: Cancel rotation temporarily to force view
                clearInterval(toggleInterval);
                const view = cmd.split(':')[1];
                if (view === 'dashboard') {
                    document.getElementById('dashboard-view').classList.remove('hidden');
                    document.getElementById('dashboard-view').classList.add('flex');
                } else {
                    document.getElementById('dashboard-view').classList.add('hidden');
                    document.getElementById('dashboard-view').classList.remove('flex');
                }
            }
            if (cmd.startsWith('trigger_screensaver')) {
                const mode = cmd.split(':')[1];
                mode === 'off' ? window.stopScreensaver() : window.startScreensaver(mode);
            }
        }

        // Image Overlay
        let overlayTimeout;
        function handleImageOverlay(data, ref) {
            document.getElementById('overlay-container').classList.remove('hidden');
            const img = document.getElementById('overlay-image');
            if (img.src !== data.url) img.src = data.url;
            img.className = "w-full h-full " + (data.fit === 'contain' ? 'object-contain' : 'object-cover');

            if (data.duration !== -1) {
                clearTimeout(overlayTimeout);
                overlayTimeout = setTimeout(() => {
                    hideImageOverlay();
                    updateDoc(ref, { imageOverlay: null });
                }, data.duration * 1000);
            }
        }
        function hideImageOverlay() {
            document.getElementById('overlay-container').classList.add('hidden');
        }

        window.startScreensaver = (mode) => window.Screensaver.start(mode);
        window.stopScreensaver = () => window.Screensaver.stop();

        window.Screensaver = {
            active: false, mode: 'night',
            init: function () { this.el = document.getElementById('screensaver'); },
            start: function (m) { this.active = true; this.mode = m; this.el.classList.remove('hidden'); },
            stop: function () { this.active = false; this.el.classList.add('hidden'); }
        };

        const Dashboard = {
            ws: null,
            reconnectDelay: 5000,
            clientId: 'hol-tracker-' + Date.now(),

            init: function () {
                this.startClock();
                this.connectWS();
            },

            startClock: function () {
                const el = document.getElementById('dash-clock');
                setInterval(() => {
                    el.innerText = new Date().toLocaleTimeString('nb-NO').slice(0, 5);
                }, 1000);
            },

            connectWS: function () {
                const url = `wss://ncd.idmedia.no/ws/${this.clientId}`;
                this.ws = new WebSocket(url);

                this.ws.onopen = () => {
                    this.updateStatus(true);
                    this.reconnectDelay = 5000;
                };

                this.ws.onmessage = (e) => {
                    try {
                        const data = JSON.parse(e.data);
                        if (data.event === 'update') this.updateContent(data.data);
                    } catch (err) {}
                };

                this.ws.onclose = () => {
                    this.updateStatus(false);
                    setTimeout(() => this.connectWS(), this.reconnectDelay);
                    this.reconnectDelay = Math.min(this.reconnectDelay * 2, 30000);
                };
            },

            updateStatus: function (ok) {
                const el = document.getElementById('connection-status');
                if (el) {
                    el.className = `w-4 h-4 rounded-full transition-colors duration-500 shadow-md ${ok ? 'bg-[#93D78C] shadow-[#93D78C]/50' : 'bg-m3-error shadow-m3-error/50'}`;
                }
            },

            updateContent: function (data) {
                // Quotes
                if (data.quotes && data.quotes.sadserver) {
                    const raw = data.quotes.sadserver;
                    let clean = raw.replace(/\n/g, " ").replace(/\s+/g, " ").trim();

                    let text = clean;
                    let author = "- @sadserver";
                    const splitIdx = clean.toLowerCase().lastIndexOf("- @sadserver");
                    if (splitIdx > -1) {
                        text = clean.substring(0, splitIdx).trim();
                        author = clean.substring(splitIdx).trim();
                    }

                    const el = document.getElementById('dash-quote');
                    el.className = "text-m3-secondary border-l-4 border-m3-primary pl-6 py-2";
                    el.innerHTML = `
                        <div class="text-xl md:text-2xl font-medium whitespace-nowrap overflow-hidden text-ellipsis leading-tight text-white/90">"${text}"</div>
                        <div class="text-sm font-bold text-m3-primary mt-2">${author}</div>
                    `;
                }

                // Comics
                if (data.comics) {
                    const grid = document.getElementById('comic-grid');
                    grid.innerHTML = '';
                    const sources = [
                        { domain: "vg.no", type: "Lunch" },
                        { domain: "vg.no", type: "Pappa" },
                        { domain: "tu.no", type: "Lunch" }
                    ];

                    sources.forEach(src => {
                        const group = data.comics[src.domain];
                        const list = (group && group[src.type]) ? group[src.type].slice(0, 2) : [];

                        list.forEach(imgData => {
                            let url = imgData.url.startsWith('/') ? 'https://ncd.idmedia.no' + imgData.url : imgData.url;
                            const div = document.createElement('div');
                            div.className = "w-full h-full bg-m3-surface rounded-m3-md shadow-sm border border-[#4A4458] p-3 flex items-center justify-center";
                            div.innerHTML = `<img src="${url}" class="w-full h-full object-contain max-h-full rounded-sm">`;
                            grid.appendChild(div);
                        });
                    });
                }
            }
        };

    </script>
</body>

</html>
