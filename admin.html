<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Tracker Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        m3: {
                            bg: '#141218',
                            surface: '#211F26', 
                            surfaceHigh: '#2B2930', 
                            primary: '#D0BCFF',
                            onPrimary: '#381E72',
                            primaryContainer: '#4F378B',
                            onPrimaryContainer: '#EADDFF',
                            secondary: '#CCC2DC',
                            onSecondary: '#332D41',
                            error: '#F2B8B5',
                            onError: '#8C1D18'
                        }
                    },
                    fontFamily: { sans: ['Roboto', 'sans-serif'], },
                    borderRadius: { 'm3': '28px', 'm3-md': '16px' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOcFfiRIw3sgU9eqEbwc1uc_Ur1aTOJXk",
            authDomain: "ferie-805e0.firebaseapp.com",
            projectId: "ferie-805e0",
            storageBucket: "ferie-805e0.firebasestorage.app",
            messagingSenderId: "621338557882",
            appId: "1:621338557882:web:9eae6887a484db316d7183",
            measurementId: "G-C8PT9DKJ3Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'holiday-tracker-main';

        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                document.getElementById('auth-status').innerHTML = '<span class="text-green-400">Auth OK (' + user.email + ')</span> <button onclick="window.logout()" class="ml-3 bg-m3-error hover:opacity-80 text-m3-onError px-3 py-1 rounded text-xs transition">Logg Ut</button>';
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                startListening();
            } else {
                document.getElementById('auth-status').innerHTML = '<span class="text-m3-error">Ikke innlogget</span>';
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });

        window.login = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('login-error');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Logger inn...';
            btn.disabled = true;
            errEl.classList.add('hidden');
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch(error) {
                console.error("Login Failed", error);
                errEl.innerText = "Feil e-postadresse eller passord.";
                errEl.classList.remove('hidden');
                btn.innerText = "Logg Inn";
                btn.disabled = false;
            }
        }

        window.logout = async function() {
            await signOut(auth);
            document.getElementById('session-list').innerHTML = ''; 
        }

        function startListening() {
            document.getElementById('db-status').innerText = "Connecting to DB...";
            const col = collection(db, 'artifacts', appId, 'sessions');

            onSnapshot(col, (snapshot) => {
                document.getElementById('db-status').innerHTML = `<span class="text-green-800 bg-green-200 px-2 py-0.5 rounded-full text-[10px] font-bold">Connected (${snapshot.size} sessions)</span>`;
                const list = document.getElementById('session-list');
                list.innerHTML = '';

                const now = new Date();

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const lastSeen = new Date(data.lastSeen);
                    const diffSeconds = (now - lastSeen) / 1000;
                    const isOnline = diffSeconds < 120;

                    const card = document.createElement('div');
                    card.className = `p-5 rounded-m3 flex flex-col gap-3 shadow-md ${isOnline ? 'bg-m3-surfaceHigh' : 'bg-m3-surface opacity-70'}`;

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-white font-bold text-lg">Display: ${id}</h3>
                                <p class="text-xs text-m3-secondary font-mono">${data.resolution} - ${data.userAgent.replace(/Mozilla.*?\)/, '')}</p>
                            </div>
                            <span class="px-2 py-1 rounded-full text-xs font-bold ${isOnline ? 'bg-[#A8C7FA] text-[#062E6F]' : 'bg-m3-error text-m3-onError'}">
                                ${isOnline ? 'ONLINE' : 'OFFLINE'}
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 text-sm text-m3-secondary">
                            <div class="bg-m3-surface p-3 rounded-m3-md">
                                <span class="text-xs uppercase font-bold text-m3-onSecondary">View</span><br>
                                ${data.currentView}
                            </div>
                            <div class="bg-m3-surface p-3 rounded-m3-md">
                                <span class="text-xs uppercase font-bold text-m3-onSecondary">Screensaver</span><br>
                                ${data.screensaver}
                            </div>
                        </div>

                        ${isOnline ? `
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <button onclick="sendCommand('${id}', 'set_view:dashboard')" class="bg-m3-primary text-m3-onPrimary hover:opacity-90 py-2.5 rounded-full text-sm font-bold shadow">
                                Vis Dashboard
                            </button>
                            <button onclick="sendCommand('${id}', 'set_view:tracker')" class="bg-m3-primaryContainer text-m3-onPrimaryContainer hover:opacity-90 py-2.5 rounded-full text-sm font-bold shadow">
                                Vis Tracker
                            </button>
                            <button onclick="sendCommand('${id}', 'trigger_screensaver:cleaning')" class="col-span-2 bg-[#F6BE00] text-[#4D3A00] hover:opacity-90 py-2.5 rounded-full text-sm font-bold flex items-center justify-center gap-2 shadow">
                                <span>🧹</span> Rengjøringsmodus (10m)
                            </button>
                            <button onclick="sendCommand('${id}', 'trigger_screensaver:night')" class="bg-m3-secondaryContainer text-m3-onSecondaryContainer hover:opacity-90 py-2.5 rounded-full text-sm font-bold">
                                Nattmodus
                            </button>
                            <button onclick="sendCommand('${id}', 'trigger_screensaver:off')" class="bg-m3-surface border border-m3-secondary text-m3-secondary hover:bg-m3-secondary hover:text-m3-onSecondary py-2.5 rounded-full text-sm font-bold transition">
                                Våkne
                            </button>
                            
                            <!-- Image Overlay Controls -->
                            <div class="col-span-2 border-t border-[#4A4458] pt-3 mt-2">
                                <p class="text-[10px] text-center text-m3-secondary mb-2 font-bold uppercase tracking-wider">BILDE OVERLAY</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="openImageModal('${id}')" class="bg-gradient-to-r from-pink-500 to-rose-400 text-white hover:opacity-90 py-2.5 rounded-full text-sm font-bold flex items-center justify-center gap-1 shadow">
                                        <span>🖼️</span> Vis Bilde
                                    </button>
                                     <button onclick="removeImage('${id}')" class="bg-m3-error text-m3-onError py-2.5 rounded-full text-sm font-bold hover:opacity-90">
                                        Fjern Bilde
                                    </button>
                                </div>
                                ${data.imageOverlay ? `<div class="text-[10px] text-green-400 text-center mt-2 font-bold">Aktiv Overlay: ${data.imageOverlay.duration === -1 ? 'Uendelig' : data.imageOverlay.duration + 's'}</div>` : ''}
                            </div>
                        </div>
                        ` : `
                        <button onclick="deleteSession('${id}')" class="w-full bg-m3-error/20 hover:bg-m3-error/40 text-m3-error py-3 rounded-full font-bold text-sm transition">
                            Fjern Død Skjerm
                        </button>
                        `}
                    `;
                    list.appendChild(card);
                });

                if (list.innerHTML === '') {
                    list.innerHTML = '<p class="text-m3-secondary text-center py-10">Ingen aktive skjermer funnet.</p>';
                }
            });
        }

        window.sendCommand = async function (sessionId, cmd) {
            const ref = doc(db, 'artifacts', appId, 'sessions', sessionId);
            try {
                await updateDoc(ref, { command: cmd });
                console.log("Sent", cmd, "to", sessionId);
            } catch (e) {
                console.error("Send failed", e);
                alert("Failed to send command");
            }
        }

        window.deleteSession = async function (sessionId) {
            if (!confirm("Fjern denne skjermen?")) return;
            const ref = doc(db, 'artifacts', appId, 'sessions', sessionId);
            await deleteDoc(ref);
        }

        // --- Image Overlay Logic ---
        let currentTargetSession = null;

        window.openImageModal = function (sessionId) {
            currentTargetSession = sessionId;
            document.getElementById('image-modal').classList.remove('hidden');
            document.getElementById('image-modal').classList.add('flex');
        }

        window.closeImageModal = function () {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('image-modal').classList.remove('flex');
            currentTargetSession = null;
            document.getElementById('overlay-file').value = '';
        }

        window.uploadAndSend = function () {
            if (!currentTargetSession) return;

            const fileInput = document.getElementById('overlay-file');
            const file = fileInput.files[0];
            if (!file) {
                alert("Velg et bilde først!");
                return;
            }

            const btn = document.getElementById('btn-send-image');
            const originalText = "Send til Skjerm";
            btn.innerText = "Behandler bilde...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

                    if (dataUrl.length > 900000) {
                        alert("Bildet er for stort for 'direkte sending' (Database-grense). Prøv et enklere bilde.");
                        btn.innerText = originalText;
                        btn.disabled = false;
                        return;
                    }

                    sendToFirestore(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);

            async function sendToFirestore(base64Url) {
                btn.innerText = "Sender...";
                const duration = parseInt(document.getElementById('overlay-duration').value);
                const fitMode = document.querySelector('input[name="fit"]:checked').value;

                try {
                    const sessionRef = doc(db, 'artifacts', appId, 'sessions', currentTargetSession);
                    await updateDoc(sessionRef, {
                        imageOverlay: {
                            url: base64Url,
                            duration: duration,
                            fit: fitMode,
                            startedAt: serverTimestamp()
                        }
                    });

                    closeImageModal();
                    console.log("Image sent (Base64)");
                } catch (e) {
                    console.error("Firestore Error", e);
                    alert("Kunne ikke sende bildet: " + e.message);
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            }
        }

        window.removeImage = async function (sessionId) {
            const sessionRef = doc(db, 'artifacts', appId, 'sessions', sessionId);
            try {
                await updateDoc(sessionRef, {
                    imageOverlay: null
                });
            } catch (e) {
                console.error("Remove failed", e);
            }
        }
    </script>
</head>

<body class="bg-m3-bg text-m3-secondary min-h-screen relative overflow-x-hidden">

    <!-- LOGIN SCREEN -->
    <div id="login-container" class="fixed inset-0 flex items-center justify-center p-4 bg-m3-bg z-[100] transition-opacity duration-500">
        <div class="bg-m3-surfaceHigh p-10 rounded-m3 w-full max-w-sm shadow-[0_4px_12px_rgba(0,0,0,0.5)] z-10 relative">
            <a href="index.html" class="absolute top-6 right-6 text-m3-secondary hover:text-white transition-colors" title="Tilbake til forsiden">
                <i class="fa-solid fa-xmark text-xl"></i>
            </a>

            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 rounded-full bg-m3-primaryContainer flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-lock text-3xl text-m3-onPrimaryContainer"></i>
                </div>
            </div>
            
            <h2 class="text-3xl font-bold text-center text-white mb-2">Admin Tilgang</h2>
            <p class="text-m3-secondary text-center text-sm mb-8">Logg inn for skjermstyring</p>
            
            <form onsubmit="window.login(event)" class="space-y-5">
                <div>
                    <input type="email" id="login-email" required placeholder="E-postadresse" class="w-full bg-m3-surface border border-m3-secondaryContainer rounded-t-md rounded-b-md p-4 text-white focus:border-m3-primary focus:ring-1 focus:ring-m3-primary outline-none transition-all">
                </div>
                <div>
                    <input type="password" id="login-pass" required placeholder="Passord" class="w-full bg-m3-surface border border-m3-secondaryContainer rounded-t-md rounded-b-md p-4 text-white focus:border-m3-primary focus:ring-1 focus:ring-m3-primary outline-none transition-all">
                </div>
                <div id="login-error" class="bg-m3-error text-m3-onError text-sm hidden font-bold text-center p-3 rounded-md"></div>
                
                <button type="submit" id="login-btn" class="w-full bg-m3-primary hover:opacity-90 text-m3-onPrimary font-bold py-4 rounded-full transition-all mt-4 shadow-md">
                    Logg Inn
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="max-w-5xl mx-auto p-6 hidden">
        <header class="flex items-center justify-between mb-8 pb-4 border-b border-[#4A4458]">
            <div class="flex items-center gap-4">
                <a href="index.html" class="w-12 h-12 rounded-full bg-m3-surfaceHigh hover:bg-m3-surface flex items-center justify-center transition-colors shadow-sm">
                    <i class="fa-solid fa-arrow-left text-m3-secondary hover:text-white"></i>
                </a>
                <div>
                    <h1 class="text-3xl font-bold text-white">
                        Kontrollsenter
                    </h1>
                    <div class="text-sm text-m3-primary font-medium tracking-wide">Info Screen Admin</div>
                </div>
            </div>
            
            <div class="text-right">
                <div id="auth-status" class="flex items-center justify-end font-medium">Laster...</div>
                <div id="db-status" class="text-xs mt-2 text-right flex justify-end">Waiting...</div>
            </div>
        </header>

        <div id="session-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Sessions go here -->
            <div class="col-span-full text-center text-m3-secondary animate-pulse font-medium py-12 bg-m3-surfaceHigh rounded-m3">Laster inn skjermer...</div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="image-modal"
        class="hidden fixed inset-0 bg-[#0B101E]/90 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-m3-surfaceHigh p-8 rounded-m3 max-w-md w-full shadow-2xl">
            <h3 class="text-2xl font-bold text-white mb-6">Send Bilde til Skjerm</h3>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-m3-secondary mb-2">Velg bilde</label>
                    <input type="file" id="overlay-file" accept="image/*"
                        class="w-full bg-m3-surface border border-m3-secondaryContainer rounded-xl p-3 text-sm text-white focus:border-m3-primary outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-bold file:bg-m3-primary file:text-m3-onPrimary">
                </div>

                <div>
                    <label class="block text-sm font-bold text-m3-secondary mb-2">Varighet</label>
                    <div class="grid grid-cols-4 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="10" checked
                                onchange="document.getElementById('overlay-duration').value=10" class="peer sr-only">
                            <div class="bg-m3-surface peer-checked:bg-m3-primaryContainer peer-checked:text-m3-onPrimaryContainer text-m3-secondary py-2.5 rounded-xl text-center text-sm font-bold border border-transparent transition-all">
                                10s
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="30"
                                onchange="document.getElementById('overlay-duration').value=30" class="peer sr-only">
                            <div class="bg-m3-surface peer-checked:bg-m3-primaryContainer peer-checked:text-m3-onPrimaryContainer text-m3-secondary py-2.5 rounded-xl text-center text-sm font-bold border border-transparent transition-all">
                                30s
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="60"
                                onchange="document.getElementById('overlay-duration').value=60" class="peer sr-only">
                            <div class="bg-m3-surface peer-checked:bg-m3-primaryContainer peer-checked:text-m3-onPrimaryContainer text-m3-secondary py-2.5 rounded-xl text-center text-sm font-bold border border-transparent transition-all">
                                1m
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="-1"
                                onchange="document.getElementById('overlay-duration').value=-1" class="peer sr-only">
                            <div class="bg-m3-surface peer-checked:bg-m3-secondaryContainer peer-checked:text-m3-onSecondaryContainer text-m3-secondary py-2.5 rounded-xl text-center text-sm font-bold border border-transparent transition-all">
                                ∞
                            </div>
                        </label>
                    </div>
                    <input type="hidden" id="overlay-duration" value="10">
                </div>

                <div>
                    <label class="block text-sm font-bold text-m3-secondary mb-2">Tilpasning</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="fit" value="contain" class="peer sr-only">
                            <div class="bg-m3-surface peer-checked:bg-m3-primaryContainer peer-checked:text-m3-onPrimaryContainer text-m3-secondary py-3 rounded-xl text-center text-sm font-bold transition-all">
                                Vis Hele
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="fit" value="cover" checked class="peer sr-only">
                            <div class="bg-m3-surface peer-checked:bg-m3-primaryContainer peer-checked:text-m3-onPrimaryContainer text-m3-secondary py-3 rounded-xl text-center text-sm font-bold transition-all">
                                Fyll Skjerm
                            </div>
                        </label>
                    </div>
                </div>

                <div class="flex gap-3 mt-8 pt-4 border-t border-[#4A4458]">
                    <button onclick="closeImageModal()"
                        class="flex-1 bg-transparent border border-m3-secondary text-m3-secondary hover:bg-m3-secondary hover:text-m3-onSecondary py-3.5 rounded-full font-bold transition-colors">
                        Avbryt
                    </button>
                    <button id="btn-send-image" onclick="uploadAndSend()"
                        class="flex-1 bg-m3-primary text-m3-onPrimary hover:opacity-90 py-3.5 rounded-full font-bold transition-all shadow-md">
                        Send til Skjerm
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
