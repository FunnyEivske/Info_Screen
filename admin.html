<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Tracker Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for the Lock Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        // Changed to Email/Password import
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCOcFfiRIw3sgU9eqEbwc1uc_Ur1aTOJXk",
            authDomain: "ferie-805e0.firebaseapp.com",
            projectId: "ferie-805e0",
            storageBucket: "ferie-805e0.firebasestorage.app",
            messagingSenderId: "621338557882",
            appId: "1:621338557882:web:9eae6887a484db316d7183",
            measurementId: "G-C8PT9DKJ3Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'holiday-tracker-main';

        // Listen for authentication changes
        onAuthStateChanged(auth, (user) => {
            if (user && !user.isAnonymous) {
                // Logged in securely
                document.getElementById('auth-status').innerHTML = '<span class="text-green-400">Auth OK (' + user.email + ')</span> <button onclick="window.logout()" class="ml-3 bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-xs transition">Logg Ut</button>';
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                startListening();
            } else {
                // Not logged in (or explicitly logged out)
                document.getElementById('auth-status').innerHTML = '<span class="text-red-400">Ikke innlogget</span>';
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('main-content').classList.add('hidden');
            }
        });

        // Handle Login Submission
        window.login = async function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            const btn = document.getElementById('login-btn');
            const errEl = document.getElementById('login-error');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Logger inn...';
            btn.disabled = true;
            errEl.classList.add('hidden');
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // onAuthStateChanged will handle the UI transition on success
            } catch(error) {
                console.error("Login Failed", error);
                errEl.innerText = "Feil e-postadresse eller passord.";
                errEl.classList.remove('hidden');
                btn.innerText = "Logg Inn";
                btn.disabled = false;
            }
        }

        // Handle Logout
        window.logout = async function() {
            await signOut(auth);
            document.getElementById('session-list').innerHTML = ''; // Clear sessions to ensure security on logout
        }

        function startListening() {
            document.getElementById('db-status').innerText = "Connecting to DB...";
            const col = collection(db, 'artifacts', appId, 'sessions');

            onSnapshot(col, (snapshot) => {
                document.getElementById('db-status').innerHTML = `<span class="text-green-400">Connected (${snapshot.size} sessions)</span>`;
                const list = document.getElementById('session-list');
                list.innerHTML = '';

                const now = new Date();

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const lastSeen = new Date(data.lastSeen);
                    const diffSeconds = (now - lastSeen) / 1000;

                    const isOnline = diffSeconds < 120;

                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border-2 flex flex-col gap-3 ${isOnline ? 'bg-slate-800 border-green-500/50' : 'bg-slate-900 border-gray-700 opacity-70'}`;

                    card.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-white font-bold text-lg">Display: ${id}</h3>
                                <p class="text-xs text-gray-400 font-mono">${data.resolution} - ${data.userAgent.replace(/Mozilla.*?\)/, '')}</p>
                            </div>
                            <span class="px-2 py-1 rounded text-xs font-bold ${isOnline ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">
                                ${isOnline ? 'ONLINE' : 'OFFLINE'}
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 text-sm text-gray-300">
                            <div class="bg-black/30 p-2 rounded">
                                <span class="text-gray-500 text-xs uppercase">View</span><br>
                                ${data.currentView}
                            </div>
                            <div class="bg-black/30 p-2 rounded">
                                <span class="text-gray-500 text-xs uppercase">Screensaver</span><br>
                                ${data.screensaver}
                            </div>
                        </div>

                        ${isOnline ? `
                        <div class="grid grid-cols-2 gap-2 mt-2">
                            <button onclick="sendCommand('${id}', 'set_view:dashboard')" class="bg-blue-600 hover:bg-blue-500 text-white py-2 rounded text-sm font-bold">
                                Show Dashboard
                            </button>
                            <button onclick="sendCommand('${id}', 'set_view:tracker')" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded text-sm font-bold">
                                Show Tracker
                            </button>
                            <button onclick="sendCommand('${id}', 'trigger_screensaver:cleaning')" class="col-span-2 bg-yellow-600 hover:bg-yellow-500 text-white py-2 rounded text-sm font-bold flex items-center justify-center gap-2">
                                <span>🧹</span> Start Cleaning Mode (10m)
                            </button>
                            <button onclick="sendCommand('${id}', 'trigger_screensaver:night')" class="bg-purple-600 hover:bg-purple-500 text-white py-2 rounded text-sm font-bold">
                                Force Night Mode
                            </button>
                            <button onclick="sendCommand('${id}', 'trigger_screensaver:off')" class="bg-gray-600 hover:bg-gray-500 text-white py-2 rounded text-sm font-bold">
                                Wake Up
                            </button>
                            
                            <!-- Image Overlay Controls -->
                            <div class="col-span-2 border-t border-gray-700 pt-2 mt-1">
                                <p class="text-xs text-center text-gray-500 mb-1">IMAGE OVERLAY</p>
                                <div class="grid grid-cols-2 gap-2">
                                    <button onclick="openImageModal('${id}')" class="bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white py-2 rounded text-sm font-bold flex items-center justify-center gap-1">
                                        <span>🖼️</span> Vis Bilde
                                    </button>
                                     <button onclick="removeImage('${id}')" class="bg-red-900/50 hover:bg-red-900 text-red-200 py-2 rounded text-sm font-bold border border-red-900">
                                        Fjern Bilde
                                    </button>
                                </div>
                                ${data.imageOverlay ? `<div class="text-[10px] text-green-400 text-center mt-1">Active: ${data.imageOverlay.duration === -1 ? 'Forever' : data.imageOverlay.duration + 's'}</div>` : ''}
                            </div>
                        </div>
                        ` : `
                        <button onclick="deleteSession('${id}')" class="w-full bg-red-900/50 hover:bg-red-900 text-red-200 py-2 rounded text-sm">
                            Remove Dead Session
                        </button>
                        `}
                    `;
                    list.appendChild(card);
                });

                if (list.innerHTML === '') {
                    list.innerHTML = '<p class="text-gray-500 text-center py-10">No active sessions found.</p>';
                }
            });
        }

        window.sendCommand = async function (sessionId, cmd) {
            const ref = doc(db, 'artifacts', appId, 'sessions', sessionId);
            try {
                await updateDoc(ref, { command: cmd });
                console.log("Sent", cmd, "to", sessionId);
            } catch (e) {
                console.error("Send failed", e);
                alert("Failed to send command");
            }
        }

        window.deleteSession = async function (sessionId) {
            if (!confirm("Remove this session?")) return;
            const ref = doc(db, 'artifacts', appId, 'sessions', sessionId);
            await deleteDoc(ref);
        }

        // --- Image Overlay Logic ---
        let currentTargetSession = null;

        window.openImageModal = function (sessionId) {
            currentTargetSession = sessionId;
            document.getElementById('image-modal').classList.remove('hidden');
            document.getElementById('image-modal').classList.add('flex');
        }

        window.closeImageModal = function () {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('image-modal').classList.remove('flex');
            currentTargetSession = null;
            document.getElementById('overlay-file').value = '';
        }

        window.uploadAndSend = function () {
            if (!currentTargetSession) return;

            const fileInput = document.getElementById('overlay-file');
            const file = fileInput.files[0];
            if (!file) {
                alert("Velg et bilde først!");
                return;
            }

            const btn = document.getElementById('btn-send-image');
            const originalText = "Send til Skjerm";
            btn.innerText = "Behandler bilde...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    const MAX_SIZE = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

                    if (dataUrl.length > 900000) {
                        alert("Bildet er for stort for 'direkte sending' (Database-grense). Prøv et enklere bilde.");
                        btn.innerText = originalText;
                        btn.disabled = false;
                        return;
                    }

                    sendToFirestore(dataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);

            async function sendToFirestore(base64Url) {
                btn.innerText = "Sender...";
                const duration = parseInt(document.getElementById('overlay-duration').value);
                const fitMode = document.querySelector('input[name="fit"]:checked').value;

                try {
                    const sessionRef = doc(db, 'artifacts', appId, 'sessions', currentTargetSession);
                    await updateDoc(sessionRef, {
                        imageOverlay: {
                            url: base64Url,
                            duration: duration,
                            fit: fitMode,
                            startedAt: serverTimestamp()
                        }
                    });

                    closeImageModal();
                    console.log("Image sent (Base64)");
                } catch (e) {
                    console.error("Firestore Error", e);
                    alert("Kunne ikke sende bildet: " + e.message);
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            }
        }

        window.removeImage = async function (sessionId) {
            const sessionRef = doc(db, 'artifacts', appId, 'sessions', sessionId);
            try {
                await updateDoc(sessionRef, {
                    imageOverlay: null
                });
            } catch (e) {
                console.error("Remove failed", e);
            }
        }
    </script>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen relative overflow-x-hidden">

    <!-- LOGIN SCREEN -->
    <div id="login-container" class="fixed inset-0 flex items-center justify-center p-4 bg-[#0B101E] z-[100] transition-opacity duration-500">
        
        <!-- Premium UI Background Elements (Matching Hub) -->
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-red-600/10 rounded-full mix-blend-screen filter blur-[128px] animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-purple-600/10 rounded-full mix-blend-screen filter blur-[128px] animate-pulse" style="animation-delay: 2s;"></div>

        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-sm shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-10 relative backdrop-blur-md">
            <!-- Back to Hub shortcut -->
            <a href="index.html" class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors" title="Tilbake til forsiden">
                <i class="fa-solid fa-xmark text-xl"></i>
            </a>

            <div class="flex justify-center mb-6">
                <div class="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center shadow-[0_0_20px_rgba(239,68,68,0.2)]">
                    <i class="fa-solid fa-lock text-3xl text-red-500"></i>
                </div>
            </div>
            
            <h2 class="text-2xl font-black text-center text-white mb-2 tracking-tight">Admin Tilgang</h2>
            <p class="text-slate-400 text-center text-sm mb-6">Logg inn for å få tilgang til skjermstyring</p>
            
            <form onsubmit="window.login(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1 ml-1 font-medium">E-postadresse</label>
                    <input type="email" id="login-email" required placeholder="admin@example.com" class="w-full bg-slate-950/50 border border-slate-700/50 rounded-xl p-3.5 text-white focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1 ml-1 font-medium">Passord</label>
                    <input type="password" id="login-pass" required placeholder="••••••••" class="w-full bg-slate-950/50 border border-slate-700/50 rounded-xl p-3.5 text-white focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition-all">
                </div>
                <div id="login-error" class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm hidden font-medium text-center p-3 rounded-lg"></div>
                
                <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold py-3.5 rounded-xl transition-all mt-6 shadow-[0_0_15px_rgba(220,38,38,0.3)] hover:shadow-[0_0_25px_rgba(220,38,38,0.5)] transform hover:scale-[1.02]">
                    Logg Inn
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content" class="max-w-4xl mx-auto p-6 hidden">
        <header class="flex items-center justify-between mb-8 pb-4 border-b border-slate-800">
            <div class="flex items-center gap-4">
                <a href="index.html" class="w-10 h-10 rounded-full bg-slate-800 hover:bg-slate-700 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-arrow-left text-slate-400 hover:text-white"></i>
                </a>
                <div>
                    <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">
                        Control Center
                    </h1>
                    <div class="text-xs text-gray-500 font-medium tracking-wide">Holiday Tracker Admin Display</div>
                </div>
            </div>
            
            <div class="text-right">
                <div id="auth-status" class="flex items-center justify-end font-medium">Laster...</div>
                <div id="db-status" class="text-xs text-gray-400 mt-1">Waiting...</div>
            </div>
        </header>

        <div id="session-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Sessions go here -->
            <div class="col-span-full text-center text-gray-500 animate-pulse font-medium py-12 bg-slate-900 border border-dashed border-slate-700 rounded-2xl">Laster inn skjermer...</div>
        </div>
    </div>

    <!-- Image Modal (Admin Modals) -->
    <div id="image-modal"
        class="hidden fixed inset-0 bg-[#0B101E]/90 z-[200] items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-slate-900 border border-slate-700 p-8 rounded-2xl max-w-md w-full shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
            <h3 class="text-2xl font-bold text-white mb-6 tracking-tight">Last opp bilde til skjerm</h3>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Velg bilde</label>
                    <input type="file" id="overlay-file" accept="image/*"
                        class="w-full bg-slate-950/50 border border-slate-700/50 rounded-xl p-3 text-sm text-white focus:border-blue-500 outline-none file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-bold file:bg-slate-800 file:text-white hover:file:bg-slate-700">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Varighet</label>
                    <div class="grid grid-cols-4 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="10" checked
                                onchange="document.getElementById('overlay-duration').value=10" class="peer sr-only">
                            <div class="bg-slate-800 peer-checked:bg-blue-600 peer-checked:text-white text-gray-400 py-2.5 rounded-lg text-center text-sm font-bold border border-slate-700/50 peer-checked:border-blue-500 transition-all hover:bg-slate-700">
                                10s
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="30"
                                onchange="document.getElementById('overlay-duration').value=30" class="peer sr-only">
                            <div class="bg-slate-800 peer-checked:bg-blue-600 peer-checked:text-white text-gray-400 py-2.5 rounded-lg text-center text-sm font-bold border border-slate-700/50 peer-checked:border-blue-500 transition-all hover:bg-slate-700">
                                30s
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="60"
                                onchange="document.getElementById('overlay-duration').value=60" class="peer sr-only">
                            <div class="bg-slate-800 peer-checked:bg-blue-600 peer-checked:text-white text-gray-400 py-2.5 rounded-lg text-center text-sm font-bold border border-slate-700/50 peer-checked:border-blue-500 transition-all hover:bg-slate-700">
                                1m
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="duration" value="-1"
                                onchange="document.getElementById('overlay-duration').value=-1" class="peer sr-only">
                            <div class="bg-slate-800 peer-checked:bg-purple-600 peer-checked:text-white text-gray-400 py-2.5 rounded-lg text-center text-sm font-bold border border-slate-700/50 peer-checked:border-purple-500 transition-all hover:bg-slate-700">
                                ∞
                            </div>
                        </label>
                    </div>
                    <input type="hidden" id="overlay-duration" value="10">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Tilpasning</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="fit" value="contain" class="peer sr-only">
                            <div class="bg-slate-800 peer-checked:bg-indigo-600 peer-checked:text-white text-gray-400 py-3 rounded-lg text-center text-sm font-bold border border-slate-700/50 peer-checked:border-indigo-500 transition-all hover:bg-slate-700">
                                Vis Hele
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="fit" value="cover" checked class="peer sr-only">
                            <div class="bg-slate-800 peer-checked:bg-indigo-600 peer-checked:text-white text-gray-400 py-3 rounded-lg text-center text-sm font-bold border border-slate-700/50 peer-checked:border-indigo-500 transition-all hover:bg-slate-700">
                                Fyll Skjerm
                            </div>
                        </label>
                    </div>
                </div>

                <div class="flex gap-3 mt-8 pt-4 border-t border-slate-800">
                    <button onclick="closeImageModal()"
                        class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-3.5 rounded-xl font-bold transition-colors">
                        Avbryt
                    </button>
                    <button id="btn-send-image" onclick="uploadAndSend()"
                        class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-xl font-bold transition-all shadow-[0_0_15px_rgba(37,99,235,0.3)]">
                        Send til Skjerm
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
