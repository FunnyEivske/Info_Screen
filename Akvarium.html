<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunsj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Skjuler scrollbars */
        }

        /* Container for bakgrunnsvideo (Nå bilde) */
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: opacity 0.5s ease-in-out;
            
            background-image: url('https://images.unsplash.com/photo-1535591273668-5782c3618f4a?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1920&q=80');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* Overlay for meldinger */
        #message-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Skjult som standard */
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
            background-color: rgba(0, 0, 0, 0.6);
            font-size: 5vw;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0,0,0,0.7);
            padding: 20px;
        }

        /* Skjerm for "etter stengetid" */
        #after-hours {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Skjult som standard */
            justify-content: center;
            align-items: center;
            /* ENDRET: Bakgrunn er nå svart */
            background-color: #000; 
            z-index: 20;
            transition: opacity 0.5s ease-in-out;
        }

        #uia-logo {
            width: 60%;
            max-width: 400px;
        }

        /* --- ENDRING: Debug-knapper (Nytt design) --- */
        #debug-controls {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: row; /* ENDRET: Horisontal layout */
            flex-wrap: wrap; /* Tillat wrapping på små skjermer */
            gap: 10px; /* Avstand mellom elementer */
            align-items: center;
        }
        
        /* Felles stil for knapper og dropdowns */
        #debug-controls button,
        #debug-controls select {
            background-color: #f0f0f0;
            color: #333;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.9em;
        }
        
        #debug-controls button:hover,
        #debug-controls select:hover {
            background-color: #ddd;
        }
        
        /* Stil for "Simuler"-knappen */
        #simulate-btn {
            background-color: #4CAF50; /* Grønn */
            color: white;
        }
        #simulate-btn:hover {
            background-color: #45a049;
        }

        /* Stil for debug-display */
        #debug-display {
            background-color: #333;
            color: #f0f0f0;
            padding: 8px 12px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 0.9em;
            text-align: center;
        }
        /* --- Slutt på CSS --- */
    </style>
</head>
<body>

    <!-- 1. Bakgrunnsbilde -->
    <div id="video-background"></div>

    <!-- 2. Meldings-overlay -->
    <div id="message-overlay">
        <span id="message-text"></span>
    </div>

    <!-- 3. "Etter stengetid"-skjerm -->
    <div id="after-hours">
        <!-- ENDRET: Bytter til hvit logo for svart bakgrunn -->
        <img id="uia-logo" src="https://www.uia.no/om-uia/profil/logofiler/uia-logo-hvit-bokmal_svg.svg" alt="Universitetet i Agder Logo">
    </div>

    <!-- ENDRET: Fullstendig nytt Debug-panel -->
    <div id="debug-controls">
        <div id="debug-display">Laster...</div>
        
        <!-- Dropdown for Dag -->
        <select id="debug-day">
            <option value="1">Mandag</option>
            <option value="2">Tirsdag</option>
            <option value="3">Onsdag</option>
            <option value="4">Torsdag</option>
            <option value="5">Fredag</option>
            <option value="6">Lørdag</option>
            <option value="0">Søndag</option>
        </select>
        
        <!-- Dropdown for Tid/Hendelse -->
        <select id="debug-time">
            <option value="14:0">Ingen Melding (14:00)</option>
            <option value="8:2">Velkommen (08:02)</option>
            <option value="10:20">Varsel 10:30 (10:20)</option>
            <option value="10:35">Lunsj 10:30 (10:35)</option>
            <option value="10:50">Varsel 11:00 (10:50)</option>
            <option value="11:5">Lunsj 11:00 (11:05)</option>
            <option value="11:20">Varsel 11:30 (11:20)</option>
            <option value="11:35">Lunsj 11:30 (11:35)</option>
            <option value="15:35">Hjem (15:35)</option>
            <option value="16:5">Etter Tid (16:05)</option>
        </select>
        
        <!-- Simuler-knapp -->
        <button id="simulate-btn">Simuler</button>
        
        <!-- Reset-knapp (har nå ny funksjon) -->
        <button onclick="resetSimulering()">Reset (Ekte tid)</button>
    </div>
    <!-- Slutt på debug-panel -->

    <script>
        // Datastruktur for lunsjplan (Fullført)
        const lunchSchedule = {
            1: { // Mandag
                "10:30": "Mariann",
                "11:00": "Mathilde, Jonny, Olai",
                "11:30": "AC, Audun"
            },
            2: { // Tirsdag
                "10:30": "Mariann",
                "11:00": "Jonny, Audun",
                "11:30": "AC, Mathilde, Olai"
            },
            3: { // Onsdag
                "10:30": "Mariann",
                "11:00": "AC, Mathilde, Audun",
                "11:30": "Jonny, Olai"
            },
            4: { // Torsdag
                "10:30": "Mariann",
                "11:00": "Jonny, Olai",
                "11:30": "AC, Audun, Mathilde"
            },
            5: { // Fredag
                "10:30": "Mariann",
                "11:00": "Mathilde, Jonny, Audun",
                "11:30": "AC, Olai"
            },
            0: { "10:30": "-", "11:00": "-", "11:30": "-" }, // Søndag
            6: { "10:30": "-", "11:00": "-", "11:30": "-" }  // Lørdag
        };

        // Hjelpe-array for dager
        const dayNames = ["Søndag", "Mandag", "Tirsdag", "Onsdag", "Torsdag", "Fredag", "Lørdag"];
        
        // NY: Variabel for å holde styr på auto-oppdatering
        let simuleringsIntervall = null;

        // Funksjonen godtar nå 'forceHour', 'forceMinute', og 'forceDay'
        function checkTime(forceHour, forceMinute, forceDay) {
            const now = new Date();
            
            const hour = (forceHour !== undefined) ? forceHour : now.getHours();
            const minute = (forceMinute !== undefined) ? forceMinute : now.getMinutes();
            const dayOfWeek = (forceDay !== undefined) ? forceDay : now.getDay(); 

            // Oppdater debug-display
            const debugDisplay = document.getElementById('debug-display');
            if (debugDisplay) {
                const dayStr = dayNames[dayOfWeek];
                const hourStr = String(hour).padStart(2, '0');
                const minStr = String(minute).padStart(2, '0');
                const prefix = (forceHour !== undefined) ? "Sim:" : "Ekte tid:";
                debugDisplay.textContent = `${prefix} ${dayStr} ${hourStr}:${minStr}`;
            }

            const messageOverlay = document.getElementById('message-overlay');
            const messageText = document.getElementById('message-text');
            const afterHoursScreen = document.getElementById('after-hours');
            const videoBackground = document.getElementById('video-background');

            const todaySchedule = lunchSchedule[dayOfWeek] || lunchSchedule[0]; 
            let message = ""; 

            // --- Logikk for meldinger ---
            if (hour === 8 && minute >= 0 && minute < 5) {
                message = "Velkommen tilbake!";
            }
            else if (hour === 11 && minute >= 15 && minute < 30) {
                 message = `Lunsj nærmer seg! (11:30)<br><small style="font-size: 0.6em">${todaySchedule['11:30']}</small>`;
            }
            else if (hour === 11 && minute >= 30) {
                message = `Det er lunsj! (11:30)<br><small style="font-size: 0.6em">${todaySchedule['11:30']}</small>`;
            }
            else if (hour === 10 && minute >= 45) {
                 message = `Lunsj nærmer seg! (11:00)<br><small style="font-size: 0.6em">${todaySchedule['11:00']}</small>`;
            }
            else if (hour === 11 && minute < 15) { // 11:00 - 11:14
                message = `Det er lunsj! (11:00)<br><small style="font-size: 0.6em">${todaySchedule['11:00']}</small>`;
            }
            else if (hour === 10 && minute >= 15 && minute < 30) {
                message = `Lunsj nærmer seg! (10:30)<br><small style="font-size: 0.6em">${todaySchedule['10:30']}</small>`;
            }
            else if (hour === 10 && minute >= 30 && minute < 45) { // 10:30 - 10:44
                message = `Det er lunsj! (10:30)<br><small style="font-size: 0.6em">${todaySchedule['10:30']}</small>`;
            }
            else if (hour === 15 && minute >= 30) {
                message = "På tide å dra hjem!";
            }

            // --- Logikk for visning ---
            if (hour >= 16 || hour < 8) {
                afterHoursScreen.style.display = 'flex';
                videoBackground.style.opacity = '0';
                messageOverlay.style.display = 'none';
            } 
            else {
                afterHoursScreen.style.display = 'none';
                videoBackground.style.opacity = '1';

                if (message) {
                    messageText.innerHTML = message;
                    messageOverlay.style.display = 'flex';
                } else {
                    messageOverlay.style.display = 'none';
                }
            }
        }

        // NY: Funksjon for å resette simulering
        function resetSimulering() {
            clearInterval(simuleringsIntervall); // Stopp eventuell gammel timer
            checkTime(); // Kjør med ekte tid umiddelbart
            simuleringsIntervall = setInterval(() => checkTime(), 10000); // Start ny timer
        }

        // NY: Setter opp event listeners når DOM er lastet
        document.addEventListener('DOMContentLoaded', function() {
            
            // Sett opp "Simuler"-knappen
            document.getElementById('simulate-btn').addEventListener('click', function() {
                clearInterval(simuleringsIntervall); // Stopp auto-oppdatering
                
                const day = document.getElementById('debug-day').value;
                const time = document.getElementById('debug-time').value;
                
                const parts = time.split(':');
                const hour = parseInt(parts[0], 10);
                const minute = parseInt(parts[1], 10);
                
                // Kjør simuleringen
                checkTime(hour, minute, parseInt(day, 10));
            });

            // Start med ekte tid
            resetSimulering();
        });

    </script>

</body>
</html>
