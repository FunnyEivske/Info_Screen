<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrer Ferie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        m3: {
                            bg: '#141218',
                            surface: '#211F26', 
                            surfaceHigh: '#2B2930', 
                            primary: '#D0BCFF',
                            onPrimary: '#381E72',
                            primaryContainer: '#4F378B',
                            onPrimaryContainer: '#EADDFF',
                            secondary: '#CCC2DC',
                            onSecondary: '#332D41',
                            error: '#F2B8B5',
                            onError: '#8C1D18'
                        }
                    },
                    fontFamily: { sans: ['Roboto', 'sans-serif'], },
                    borderRadius: { 'm3': '28px', 'm3-md': '16px' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Config & Init ---
        const firebaseConfig = {
            apiKey: "AIzaSyCOcFfiRIw3sgU9eqEbwc1uc_Ur1aTOJXk",
            authDomain: "ferie-805e0.firebaseapp.com",
            projectId: "ferie-805e0",
            storageBucket: "ferie-805e0.firebasestorage.app",
            messagingSenderId: "621338557882",
            appId: "1:621338557882:web:9eae6887a484db316d7183",
            measurementId: "G-C8PT9DKJ3Q"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'holiday-tracker-main';

        async function initApp() {
            try {
                await signInAnonymously(auth);
            } catch (error) {
                console.error("Auth error", error);
            }
        }

        function getSeason() {
            const date = new Date();
            const month = date.getMonth(); 
            const day = date.getDate();

            if (month === 11 || (month === 0 && day <= 5)) return 'christmas';
            if (month === 1 && day >= 15 && day <= 28) return 'winter';
            if (month === 2 || (month === 3 && day <= 22)) return 'spring';
            if ((month === 5 && day >= 20) || month === 6 || (month === 7 && day <= 18)) return 'summer';
            if ((month === 8 && day >= 28) || (month === 9 && day <= 10)) return 'autumn';

            return 'spring'; 
        }

        window.submitForm = async function (e) {
            e.preventDefault();
            const name = document.getElementById('input-name').value;
            const color = document.getElementById('selected-color').value;
            const emoji = document.getElementById('selected-emoji').value;
            const startDate = document.getElementById('input-start').value;
            const endDate = document.getElementById('input-end').value;

            if (!name || !startDate || !endDate) return;

            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "Lagrer...";
            btn.disabled = true;

            try {
                const currentSeason = getSeason() || 'christmas'; 
                const col = collection(db, 'artifacts', appId, 'public', 'data', currentSeason);
                await addDoc(col, { name, color, emoji, startDate, endDate });

                document.getElementById('form-container').classList.add('hidden');
                document.getElementById('success-message').classList.remove('hidden');
                document.getElementById('vacation-form').reset();
            } catch (err) {
                alert("Kunne ikke lagre: " + err.message);
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        window.selectColor = function (color) {
            document.getElementById('selected-color').value = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                if (btn.dataset.color === color) {
                    btn.classList.add('ring-4', 'ring-offset-2', 'ring-m3-primary', 'scale-110');
                } else {
                    btn.classList.remove('ring-4', 'ring-offset-2', 'ring-m3-primary', 'scale-110');
                }
            });
        }

        window.selectEmoji = function (emoji) {
            document.getElementById('selected-emoji').value = emoji;
            document.querySelectorAll('.emoji-btn').forEach(btn => {
                if (btn.dataset.emoji === emoji) {
                    btn.classList.add('bg-m3-primaryContainer', 'text-m3-onPrimaryContainer', 'scale-110', 'font-bold');
                    btn.classList.remove('hover:bg-m3-surface');
                } else {
                    btn.classList.remove('bg-m3-primaryContainer', 'text-m3-onPrimaryContainer', 'scale-110', 'font-bold');
                    btn.classList.add('hover:bg-m3-surface');
                }
            });
        }

        window.resetForm = function () {
            document.getElementById('success-message').classList.add('hidden');
            document.getElementById('form-container').classList.remove('hidden');
            window.selectColor('purple');
            window.selectEmoji('🏖️');
        }

        initApp();
        window.addEventListener('load', () => {
            window.selectColor('purple');
            window.selectEmoji('🏖️');
        });

    </script>
    <style>
        body { background-color: #141218; color: #E6E0E9; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Material 3 Input Field overrides */
        input[type="text"], input[type="date"] {
            background-color: #211F26; /* m3-surface */
            border-bottom: 2px solid #4A4458; /* neutral */
            border-radius: 4px 4px 0 0;
            transition: all 0.2s;
        }
        input[type="text"]:focus, input[type="date"]:focus {
            border-bottom: 2px solid #D0BCFF; /* m3-primary */
            background-color: #2B2930;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Material 3 Surface High Container -->
    <div id="form-container"
        class="bg-m3-surfaceHigh rounded-m3 w-full max-w-lg p-8 relative shadow-[0_4px_12px_rgba(0,0,0,0.2)] border border-[#4A4458] max-h-[90vh] overflow-y-auto no-scrollbar">
        
        <!-- Back Button -->
        <a href="index.html" class="absolute top-6 right-6 text-m3-secondary hover:text-white transition-colors" title="Tilbake til forsiden">
            ✕
        </a>

        <div class="w-16 h-16 rounded-full bg-m3-primaryContainer flex items-center justify-center mb-6 mx-auto text-3xl">
            ✈️
        </div>

        <h2 class="text-3xl font-bold text-white mb-2 text-center">Registrer Ferie</h2>
        <p class="text-m3-secondary text-center text-sm mb-8">Når tar du ferie?</p>

        <form id="vacation-form" onsubmit="submitForm(event)" class="space-y-6">
            <!-- Navn -->
            <div>
                <label class="block text-sm font-bold text-m3-secondary mb-1">Ditt Navn</label>
                <input type="text" id="input-name" required placeholder="F.eks. Kari Nordmann"
                    class="w-full p-4 text-white outline-none placeholder-[#4A4458]">
            </div>

            <!-- Fargevelger -->
            <div>
                <label class="block text-sm font-bold text-m3-secondary mb-3">Fargetema</label>
                <input type="hidden" id="selected-color" value="purple">
                <div class="flex flex-wrap gap-4 justify-center">
                    <button type="button" data-color="red" onclick="selectColor('red')" class="color-btn w-12 h-12 rounded-full bg-red-400 hover:scale-110 transition ring-offset-[#2B2930]"></button>
                    <button type="button" data-color="pink" onclick="selectColor('pink')" class="color-btn w-12 h-12 rounded-full bg-pink-400 hover:scale-110 transition ring-offset-[#2B2930]"></button>
                    <button type="button" data-color="blue" onclick="selectColor('blue')" class="color-btn w-12 h-12 rounded-full bg-blue-400 hover:scale-110 transition ring-offset-[#2B2930]"></button>
                    <button type="button" data-color="green" onclick="selectColor('green')" class="color-btn w-12 h-12 rounded-full bg-green-400 hover:scale-110 transition ring-offset-[#2B2930]"></button>
                    <button type="button" data-color="purple" onclick="selectColor('purple')" class="color-btn w-12 h-12 rounded-full bg-[#D0BCFF] hover:scale-110 transition ring-offset-[#2B2930]"></button>
                    <button type="button" data-color="orange" onclick="selectColor('orange')" class="color-btn w-12 h-12 rounded-full bg-orange-400 hover:scale-110 transition ring-offset-[#2B2930]"></button>
                    <button type="button" data-color="yellow" onclick="selectColor('yellow')" class="color-btn w-12 h-12 rounded-full bg-yellow-300 hover:scale-110 transition ring-offset-[#2B2930]"></button>
                    <button type="button" data-color="teal" onclick="selectColor('teal')" class="color-btn w-12 h-12 rounded-full bg-teal-400 hover:scale-110 transition ring-offset-[#2B2930]"></button>
                </div>
            </div>

            <!-- Emoji Velger -->
            <div>
                <label class="block text-sm font-bold text-m3-secondary mb-3">Reisemål / Ikon</label>
                <input type="hidden" id="selected-emoji" value="🏖️">
                <div class="grid grid-cols-6 gap-2">
                    <!-- Christmas / Winter -->
                    <button type="button" data-emoji="🎅" onclick="selectEmoji('🎅')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🎅</button>
                    <button type="button" data-emoji="❄️" onclick="selectEmoji('❄️')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">❄️</button>
                    <button type="button" data-emoji="⛷️" onclick="selectEmoji('⛷️')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">⛷️</button>
                    <button type="button" data-emoji="🏂" onclick="selectEmoji('🏂')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🏂</button>
                    <button type="button" data-emoji="⛄" onclick="selectEmoji('⛄')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">⛄</button>
                    <button type="button" data-emoji="🕯️" onclick="selectEmoji('🕯️')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🕯️</button>
                    
                    <!-- Spring / Easter -->
                    <button type="button" data-emoji="🐣" onclick="selectEmoji('🐣')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🐣</button>
                    <button type="button" data-emoji="🐰" onclick="selectEmoji('🐰')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🐰</button>
                    <button type="button" data-emoji="🌷" onclick="selectEmoji('🌷')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🌷</button>
                    <button type="button" data-emoji="🌱" onclick="selectEmoji('🌱')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🌱</button>
                    <button type="button" data-emoji="🌧️" onclick="selectEmoji('🌧️')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🌧️</button>
                    <button type="button" data-emoji="🌈" onclick="selectEmoji('🌈')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🌈</button>

                    <!-- Summer -->
                    <button type="button" data-emoji="🏖️" onclick="selectEmoji('🏖️')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🏖️</button>
                    <button type="button" data-emoji="✈️" onclick="selectEmoji('✈️')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">✈️</button>
                    <button type="button" data-emoji="🍉" onclick="selectEmoji('🍉')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🍉</button>
                    <button type="button" data-emoji="🍦" onclick="selectEmoji('🍦')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🍦</button>
                    <button type="button" data-emoji="🌻" onclick="selectEmoji('🌻')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🌻</button>
                    <button type="button" data-emoji="🛥️" onclick="selectEmoji('🛥️')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🛥️</button>

                    <!-- Autumn / General -->
                    <button type="button" data-emoji="🍂" onclick="selectEmoji('🍂')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🍂</button>
                    <button type="button" data-emoji="🍁" onclick="selectEmoji('🍁')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🍁</button>
                    <button type="button" data-emoji="🎃" onclick="selectEmoji('🎃')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🎃</button>
                    <button type="button" data-emoji="🍄" onclick="selectEmoji('🍄')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🍄</button>
                    <button type="button" data-emoji="🍷" onclick="selectEmoji('🍷')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🍷</button>
                    <button type="button" data-emoji="🏠" onclick="selectEmoji('🏠')" class="emoji-btn text-2xl p-2 rounded-full hover:bg-m3-surface transition">🏠</button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-m3-secondary mb-1">Fra og med</label>
                    <input type="date" id="input-start" required class="w-full p-4 text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-m3-secondary mb-1">Til og med</label>
                    <input type="date" id="input-end" required class="w-full p-4 text-white outline-none">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-m3-primary hover:opacity-90 text-m3-onPrimary font-bold py-4 rounded-full mt-6 shadow transition">
                Lagre Ferie
            </button>
        </form>
    </div>

    <!-- Success Output -->
    <div id="success-message" class="hidden text-center w-full">
        <div class="bg-m3-surfaceHigh rounded-m3 p-10 border border-[#4A4458] shadow-2xl max-w-sm mx-auto">
            <div class="w-20 h-20 rounded-full bg-[#A8C7FA] flex items-center justify-center mx-auto mb-6 text-4xl">
                ✅
            </div>
            <h2 class="text-3xl font-bold text-white mb-2">Registrert!</h2>
            <p class="text-m3-secondary mb-8">God ferie når den tid kommer!</p>
            <button onclick="resetForm()" class="bg-m3-primary text-m3-onPrimary font-bold py-3 px-8 rounded-full transition hover:opacity-90">
                Registrer en til
            </button>
            <p class="mt-6"><a href="index.html" class="text-sm text-m3-secondary underline hover:text-white">Tilbake til forside</a></p>
        </div>
    </div>

</body>
</html>
